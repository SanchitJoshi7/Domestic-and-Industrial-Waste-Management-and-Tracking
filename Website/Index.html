<!DOCTYPE html>
<html>
<head>
    <title>Industrial Waste Monitoring Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Industrial Waste Monitoring System</h1>
</header>

<nav>
    <a href="#">Dashboard</a>
    <a href="#">Industry Map</a>
    <a href="#">Waste Tracking</a>
    <a href="#">About</a>
</nav>

<section class="dashboard">

    <div class="card">
        <h2>Air Emissions</h2>
        <p>PM2.5: 34 µg/m³</p>
        <p>SO₂: 90 mg/Nm³</p>
        <p>Status: Within Limit</p>
    </div>

    <div class="card">
        <h2>Water Discharge</h2>
        <p>BOD: 18 mg/L</p>
        <p>pH: 7.2</p>
        <p>Status: Safe</p>
    </div>

    <div class="card">
        <h2>Compliance Score</h2>
        <p>Industry Rating: 92%</p>
    </div>

</section>

<script src="script.js"></script>

</body>
</html>
