<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Management & Pollution Monitoring Dashboard</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="stylesheet" href="styles/tabs.css">
    <link rel="stylesheet" href="styles/cards.css">
    <link rel="stylesheet" href="styles/forms.css">
    <link rel="stylesheet" href="styles/modals.css">
</head>
<body>
    <!-- Auth Container -->
    <div id="authContainer" class="auth-container">
        <div class="auth-modal" id="authModal">
            <div class="auth-header">
                <h1>Dashboard Access</h1>
                <p>Waste Management & Pollution Monitoring System</p>
            </div>
            
            <div class="auth-tabs">
                <button class="auth-tab-btn active" data-tab="login">Login</button>
                <button class="auth-tab-btn" data-tab="register">Register</button>
            </div>

            <!-- Login Form -->
            <div id="loginTab" class="auth-tab-content active">
                <form id="loginForm" onsubmit="window.handleLogin(event)">
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="loginUsername" required placeholder="Enter username">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" required placeholder="Enter password">
                    </div>
                    <button type="submit" class="btn-auth">Login</button>
                </form>
                <div id="loginError" class="auth-error" style="display: none;"></div>
            </div>

            <!-- Register Form -->
            <div id="registerTab" class="auth-tab-content" style="display: none;">
                <form id="registerForm" onsubmit="window.handleRegister(event)">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="regName" required placeholder="Full Name">
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="regEmail" required placeholder="Email Address">
                    </div>
                    <div class="form-group">
                        <label>Phone Number *</label>
                        <input type="tel" id="regPhone" required placeholder="Phone Number">
                    </div>
                    <div class="form-group">
                        <label>Address *</label>
                        <textarea id="regAddress" required placeholder="Full Address"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Username *</label>
                        <input type="text" id="regUsername" required placeholder="Choose username">
                    </div>
                    <div class="form-group">
                        <label>Password *</label>
                        <input type="password" id="regPassword" required placeholder="Choose password">
                    </div>
                    <div class="form-group">
                        <label>Confirm Password *</label>
                        <input type="password" id="regPasswordConfirm" required placeholder="Confirm password">
                    </div>
                    <button type="submit" class="btn-auth">Register</button>
                </form>
                <div id="registerError" class="auth-error" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboardContainer" class="dashboard-container" style="display: none;">
        <div class="container">
            <!-- Header with Logout -->
            <div class="header">
                <div style="flex: 1;">
                    <h1>Waste Management & Pollution Monitoring Dashboard</h1>
                    <p>Real-time environmental monitoring and waste management system</p>
                </div>
                <div class="header-user">
                    <span id="userName"></span>
                    <button id="logoutBtn" class="btn-logout">Logout</button>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <div class="tab-list">
                    <button class="tab-trigger active" data-tab="domestic">🏘️ Domestic Waste</button>
                    <button class="tab-trigger" data-tab="industrial">🏭 Industrial Waste</button>
                    <button class="tab-trigger" data-tab="pollution">🌍 Pollution Map</button>
                    <button class="tab-trigger" data-tab="alert">🚨 Raise Alert</button>
                </div>

                <!-- DOMESTIC WASTE TAB -->
                <div id="domestic" class="tab-content active"></div>

                <!-- INDUSTRIAL WASTE TAB -->
                <div id="industrial" class="tab-content"></div>

                <!-- POLLUTION HEATMAP TAB -->
                <div id="pollution" class="tab-content"></div>

                <!-- RAISE ALERT TAB -->
                <div id="alert" class="tab-content"></div>
            </div>
        </div>

        <!-- Modal for Alert Form -->
        <div id="alertModal" class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <span id="modalIcon" style="font-size: 24px; margin-right: 8px;"></span>
                    <div>
                        <div class="modal-title">Submit Alert to <span id="modalAuthorityName"></span></div>
                        <p style="font-size: 12px; color: #64748b; margin-top: 4px;">Fill in the details below to report a pollution incident or waste management issue</p>
                    </div>
                    <button class="modal-close" onclick="window.closeModal()">&times;</button>
                </div>
                <div class="modal-content" id="modalContent"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDemoKeyForTesting&v=3.49"></script>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/tabs.js"></script>
    <script src="js/domestic.js"></script>
    <script src="js/industrial.js"></script>
    <script src="js/maps.js"></script>
    <script src="js/pollution.js"></script>
    <script src="js/alerts.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
